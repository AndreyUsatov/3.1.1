<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List of users</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 40px;
            color: #333;
        }

        h2 {
            text-align: center;
            color: #444;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
            background-color: #fff;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #eaeaea;
        }

        a {
            text-decoration: none;
            color: #007BFF;
            margin-right: 10px;
        }

        a:hover {
            text-decoration: underline;
        }

        .add-button {
            display: block;
            width: fit-content;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border-radius: 5px;
            text-align: center;
        }

        .add-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<h2>Users</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Surname</th>
        <th>Age</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}">1</td>
        <td th:text="${user.firstName}">Name</td>
        <td th:text="${user.lastName}">Surname</td>
        <td th:text="${user.age}">30</td>
        <td th:text="${user.email}">email@mail.com</td>
        <td>
            <a th:href="@{'/users/' + ${user.id} + '/edit'}">To change</a>
            <a th:href="@{'/users/' + ${user.id} + '/delete'}"
               onclick="return confirm('Delete a user?');">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<a class="add-button" th:href="@{/users/add}">Add a new user</a>

</body>
</html>
